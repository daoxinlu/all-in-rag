<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎰 抽卡模拟器</title>

<!-- PWA 清单 (支持 Android/Chrome 安装到桌面) -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="抽卡模拟器">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f1a;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:1.6rem;margin-bottom:16px;background:linear-gradient(135deg,#f5af19,#f12711);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:14px;background:#1a1a2e;color:#aaa;transition:.2s}
.tabs button.active{background:#e94560;color:#fff}

.card-area{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;min-height:120px;margin-bottom:16px}
.card{width:120px;padding:12px 8px;border-radius:12px;text-align:center;font-size:13px;animation:fadeIn .4s;transition:transform .2s}
.card:hover{transform:scale(1.08)}
.card .name{font-weight:bold;margin-bottom:4px}
.card .stars{font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.SSR{background:linear-gradient(135deg,#f5af19,#f12711);box-shadow:0 0 20px rgba(245,175,25,.4);color:#fff}
.SR{background:linear-gradient(135deg,#8e2de2,#4a00e0);box-shadow:0 0 12px rgba(142,45,226,.3);color:#fff}
.R{background:linear-gradient(135deg,#2c3e50,#3498db);color:#ddd}

.chest-legend{background:linear-gradient(135deg,#f5af19,#f12711);box-shadow:0 0 20px rgba(245,175,25,.4);color:#fff}
.chest-epic{background:linear-gradient(135deg,#8e2de2,#4a00e0);box-shadow:0 0 12px rgba(142,45,226,.3);color:#fff}
.chest-rare{background:linear-gradient(135deg,#2c3e50,#3498db);color:#fff}
.chest-common{background:linear-gradient(135deg,#3a3a5c,#5a5a7a);color:#ccc}

.stats{display:flex;gap:16px;margin-bottom:16px;font-size:14px;flex-wrap:wrap;justify-content:center}

.actions{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
.actions button{padding:12px 24px;border:none;border-radius:10px;cursor:pointer;font-size:15px;font-weight:bold;transition:.2s}
.btn-main{background:linear-gradient(135deg,#e94560,#c23152);color:#fff}
.btn-main:active{transform:scale(.95)}
.btn-sub{background:#1a1a2e;color:#aaa;border:1px solid #333}
.btn-sub:active{transform:scale(.95)}

.config-area{margin-top:12px;width:100%;max-width:400px;display:none}
.config-area textarea{width:100%;height:120px;background:#1a1a2e;color:#ccc;border:1px solid #333;border-radius:8px;padding:10px;font-size:13px;resize:vertical}
.config-area .hint{font-size:11px;color:#666;margin:4px 0 8px}
.config-area button{background:#e94560;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px}

.history{width:100%;max-width:400px;margin-top:20px;font-size:12px;color:#666}
.history summary{margin-bottom:8px;cursor:pointer;color:#999}
.history pre{background:#1a1a2e;padding:10px;border-radius:8px;max-height:200px;overflow-y:auto;font-size:11px}
</style>
</head>
<body>

<h1>🎰 抽卡模拟器 v2.0</h1>

<div class="tabs">
  <button id="tabGenshin" class="active">原神抽卡</button>
  <button id="tabChest">宝箱开箱</button>
</div>

<div class="stats" id="stats"></div>

<div class="card-area" id="cards">
  <div style="color:#555;padding:40px">点击下方按钮开始抽卡 ✨</div>
</div>

<div class="actions" id="actions"></div>

<div class="config-area" id="configArea">
  <div class="hint">每行: 稀有度 概率 物品1,物品2,...<br>例: 传说 0.05 霜之哀伤,无尽之刃</div>
  <textarea id="configText" placeholder="传说 0.05 霜之哀伤,无尽之刃&#10;史诗 0.15 暗影斗篷,龙鳞甲&#10;普通 0.80 铁剑,布甲"></textarea>
  <button onclick="applyCustomChest()">✅ 应用配置</button>
</div>

<details class="history"><summary>📋 抽卡记录</summary><pre id="log"></pre></details>

<script>
// ═══ 数据 ═══
const GENSHIN = {
  SSR:{rate:.006,pity:90,pool:["七七","刻晴","莫娜","迪卢克","琴","钟离","胡桃","甘雨","雷电将军","纳西妲"]},
  SR:{rate:.051,pity:10,pool:["凝光","行秋","班尼特","香菱","菲谢尔","砂糖","北斗","罗莎莉亚","烟绯","久岐忍"]},
  R:{rate:.943,pity:0,pool:["黑缨枪","弹弓","魔导绪论","铁影阔剑","黎明神剑","讨龙英杰谭","冷刃","沐浴龙血的剑","神射手之誓","飞天御剑"]},
};

let CHEST = {
  "传奇":{rate:.01,pool:["霜之哀伤","无尽之刃","灭世者之帽"],css:"chest-legend"},
  "史诗":{rate:.08,pool:["暗影斗篷","龙鳞甲","凤凰羽","冰晶法杖"],css:"chest-epic"},
  "稀有":{rate:.21,pool:["秘银剑","魔法书","精灵弓","圣光盾"],css:"chest-rare"},
  "普通":{rate:.70,pool:["铁剑","布甲","木盾","治疗药水","面包","箭矢"],css:"chest-common"},
};

let pitySSR=0, pitySR=0, log=[], mode='genshin';

// ═══ 引擎 ═══
function genshinPull(n){
  const res=[];
  for(let i=0;i<n;i++){
    pitySSR++;pitySR++;
    let r;
    if(pitySSR>=GENSHIN.SSR.pity){r='SSR';pitySSR=0}
    else if(pitySR>=GENSHIN.SR.pity){r='SR';pitySR=0}
    else{
      const roll=Math.random();
      if(roll<GENSHIN.SSR.rate){r='SSR';pitySSR=pitySR=0}
      else if(roll<GENSHIN.SSR.rate+GENSHIN.SR.rate){r='SR';pitySR=0}
      else r='R';
    }
    const name=GENSHIN[r].pool[Math.floor(Math.random()*GENSHIN[r].pool.length)];
    res.push({rarity:r,name});
  }
  return res;
}

function chestPull(n,cfg=CHEST){
  const res=[];
  const entries=Object.entries(cfg);
  const total=entries.reduce((s,[,v])=>s+v.rate,0);
  for(let i=0;i<n;i++){
    let roll=Math.random()*total, cum=0;
    for(const [rarity,info] of entries){
      cum+=info.rate;
      if(roll<=cum){res.push({rarity,name:info.pool[Math.floor(Math.random()*info.pool.length)]});break}
    }
  }
  return res;
}

// ═══ 渲染 ═══
const stars={SSR:'★★★★★',SR:'★★★★',R:'★★★'};
const chestStars={传奇:'👑',史诗:'💎',稀有:'⭐',普通:'•'};

function render(res,cfgMap){
  const cards=document.getElementById('cards');
  cards.innerHTML=res.map(r=>{
    const cls=cfgMap[r.rarity]?.css||r.rarity;
    const star=mode==='genshin'?stars[r.rarity]||'':chestStars[r.rarity]||'';
    return `<div class="card ${cls}"><div class="name">${r.name}</div><div class="stars">${star}</div></div>`;
  }).join('');

  const cnt={};res.forEach(r=>cnt[r.rarity]=(cnt[r.rarity]||0)+1);
  document.getElementById('stats').innerHTML=Object.entries(cnt).map(([k,v])=>{
    const cls=cfgMap[k]?.css||k;
    return `<span class="card ${cls}" style="width:auto;padding:6px 12px;font-size:12px">${k} ×${v}</span>`;
  }).join('');

  const time=new Date().toLocaleTimeString();
  const line=`[${time}] ${res.map(r=>`${r.rarity}:${r.name}`).join(' | ')}`;
  log.unshift(line);if(log.length>50)log.pop();
  document.getElementById('log').textContent=log.join('\n');
}

// ═══ UI 交互 ═══
function getCfgMap(){
  if(mode==='genshin') return GENSHIN;
  const m={};
  for(const [k,v] of Object.entries(CHEST)) m[k]={...v,css:v.css||'R'};
  return m;
}

function doPull(n){
  const res=mode==='genshin'?genshinPull(n):chestPull(n);
  render(res,getCfgMap());
}

function applyCustomChest(){
  const raw=document.getElementById('configText').value.trim();
  if(!raw)return alert('请输入配置');
  const lines=raw.split('\n').filter(l=>l.trim());
  const cfg={};
  const css=['chest-legend','chest-epic','chest-rare','chest-common'];
  for(let i=0;i<lines.length;i++){
    const parts=lines[i].split(' ').filter(Boolean);
    if(parts.length<3)continue;
    const rarity=parts[0];
    const rate=parseFloat(parts[1]);
    if(isNaN(rate))continue;
    const pool=parts.slice(2).join(' ').split(/[,，]/).map(s=>s.trim()).filter(Boolean);
    if(!pool.length)continue;
    cfg[rarity]={rate,pool,css:css[i%css.length]};
  }
  if(Object.keys(cfg).length<2)return alert('至少需要2个稀有度等级');
  CHEST=cfg;
  alert(`✅ 配置完成！${Object.keys(cfg).length}个稀有度等级`);
}

// ═══ 切换模式 ═══
document.getElementById('tabGenshin').onclick=()=>{
  mode='genshin';
  document.getElementById('tabGenshin').classList.add('active');
  document.getElementById('tabChest').classList.remove('active');
  document.getElementById('configArea').style.display='none';
  document.getElementById('actions').innerHTML=`
    <button class="btn-main" onclick="doPull(10)">🌟 十连抽</button>
    <button class="btn-main" onclick="doPull(1)">单抽</button>
    <button class="btn-sub" onclick="pitySSR=pitySR=0">🔄 重置保底</button>
  `;
  document.getElementById('cards').innerHTML='<div style="color:#555;padding:40px">点击上方按钮开始抽卡 ✨</div>';
  document.getElementById('stats').innerHTML='';
};

document.getElementById('tabChest').onclick=()=>{
  mode='chest';
  document.getElementById('tabChest').classList.add('active');
  document.getElementById('tabGenshin').classList.remove('active');
  document.getElementById('configArea').style.display='block';
  document.getElementById('actions').innerHTML=`
    <button class="btn-main" onclick="doPull(5)">🎁 开5箱</button>
    <button class="btn-main" onclick="doPull(1)">开1箱</button>
    <button class="btn-sub" onclick="document.getElementById('configArea').style.display='block'">⚙️ 显示配置</button>
  `;
  document.getElementById('cards').innerHTML='<div style="color:#555;padding:40px">点击上方按钮开宝箱 🎁</div>';
  document.getElementById('stats').innerHTML='';
};

// 初始化
document.getElementById('tabGenshin').click();

// 注册 Service Worker (PWA 离线支持)
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js')}
</script>
</body>
</html>
